<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 7</title>
  </head>
  <body>
    <h2>Calculator</h2>
    <form id="calForm">
      <input type="number" id="num1" placeholder="Số thứ nhất" />
      <input type="number" id="num2" placeholder="Số thứ hai" />
      <br /><br />
      <button type="button" onclick="calculate('+')">Cộng (+)</button>
      <button type="button" onclick="calculate('-')">Trừ (-)</button>
      <button type="button" onclick="calculate('*')">Nhân (*)</button>
      <button type="button" onclick="calculate('/')">Chia (÷)</button>
      <button type="button" onclick="dele()">Delete</button>
    </form>

    <h3>Kết quả:</h3>
    <p id="result"></p>

    <script>
      //Một hàm duy nhất xử lý cả 4 phép toán
      function calculate(operator) {
        const num1 = parseFloat(document.getElementById("num1").value);
        const num2 = parseFloat(document.getElementById("num2").value);

        if (isNaN(num1) || isNaN(num2)) {
          document.getElementById("result").textContent = "Vui lòng số hợp lệ!";
          return;
        }
        let result;
        switch (operator) {
          case "+":
            result = num1 + num2;
            break;
          case "-":
            result = num1 - num2;
            break;
          case "*":
            result = num1 * num2;
            break;
          case "/":
            if (num2 === 0) {
              document.getElementById("result").textContent =
                "Không thể chia cho 0.";
              return;
            }
            result = num1 / num2;
            break;
        }
        document.getElementById("result").textContent = `Kết quả: ${result}`;
      }
      //Hàm xóa dữ liệu khi tính toán xong
      function dele() {
        document.getElementById("num1").value = "";
        document.getElementById("num2").value = "";
        document.getElementById("result").textContent = "";
      }
    </script>
  </body>
</html>
